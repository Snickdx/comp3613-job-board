# Render Blueprint for COMP 3613 job-board starter (FastStart base).
# Free web services sleep after inactivity. Free Postgres expires after 30 days.

services:
  - type: web
    name: job-board
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py init --no-drop && python manage.py run --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENV
        value: production
      - key: DATABASE_URI
        fromDatabase:
          name: job-board-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CONFIG_PASSWORD
        generateValue: true

databases:
  - name: job-board-db
    databaseName: jobboard
    plan: free
    region: oregon
    postgresMajorVersion: "16"
